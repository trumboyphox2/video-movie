<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho Video Của Tôi</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; text-align: center; padding: 20px; }
        .video-box { background: white; margin: 20px auto; padding: 15px; border-radius: 8px; max-width: 700px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        iframe { width: 100%; height: 400px; border: none; border-radius: 4px; }
    </style>
</head>
<body>

    <h1>Trang Web Xem Video Của Tôi</h1>
    <p>Kho lưu trữ video dung lượng lớn hoàn toàn miễn phí!</p>

    <!-- Video thứ nhất -->
    <div class="video-box">
        <h3>Tên Video Của Bạn</h3>
        <!-- Thay ID_GOOGLE_DRIVE_1 bằng ID thật của video trên Google Drive -->
        <iframe src="https://drive.google.com/file/d/ID_GOOGLE_DRIVE_1/preview" allow="autoplay"></iframe>
    </div>

</body>
</html>
